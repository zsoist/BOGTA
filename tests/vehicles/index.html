<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8" />
<title>Vehicles harness</title>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font:13px/1.3 ui-monospace,monospace}
  #game{position:fixed;inset:0;display:block}
  #hud{position:fixed;left:10px;top:10px;background:#0008;padding:8px 10px;border-radius:6px;white-space:pre;pointer-events:none}
  #prompt{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);font-size:22px;background:#000a;padding:6px 14px;border-radius:8px;display:none}
  #toast{position:fixed;right:12px;top:12px;max-width:340px;text-align:right}
  #toast div{background:#000b;margin:4px 0;padding:6px 10px;border-radius:6px}
  #err{position:fixed;left:10px;bottom:10px;color:#f88;white-space:pre-wrap;max-width:80ch}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div><div id="prompt"></div><div id="toast"></div><pre id="err"></pre>
<script type="module" src="./harness.js"></script>
</body>
</html>
