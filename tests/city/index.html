<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>city harness</title>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 12px ui-monospace, monospace; color: #fff; }
    #game { position: fixed; inset: 0; display: block; }
    #hud { position: fixed; left: 8px; top: 8px; background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 6px; }
    #hud input[type=range] { width: 220px; vertical-align: middle; }
    #err { position: fixed; left: 8px; bottom: 8px; max-width: 80ch; color: #fbb; background: rgba(60,0,0,.8); white-space: pre-wrap; display: none; padding: 6px; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  hour <input id="hour" type="range" min="0" max="24" step="0.05" value="12"> <span id="hv"></span>
  <label><input id="rain" type="checkbox"> rain</label> <label><input id="auto" type="checkbox"> clock</label>
  <span id="stats"></span>
</div>
<pre id="err"></pre>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildRoadNetwork } from '../../src/config.js';
import { state } from '../../src/core/state.js';
import { events } from '../../src/core/events.js';
import { createCity } from '../../src/world/city.js';
import { createSky } from '../../src/world/sky.js';

const errEl = document.getElementById('err');
addEventListener('error', (e) => { errEl.style.display = 'block'; errEl.textContent += (e.error?.stack || e.message) + '\n'; });
addEventListener('unhandledrejection', (e) => { errEl.style.display = 'block'; errEl.textContent += (e.reason?.stack || e.reason) + '\n'; });

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb4c7);
scene.fog = new THREE.Fog(0x9fb4c7, 90, 360);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 1200);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const net = buildRoadNetwork();
const t0 = performance.now();
const city = createCity(scene, net);
const sky = createSky(scene, renderer);
console.log('city built in', Math.round(performance.now() - t0), 'ms; colliders', city.colliders.length);

state.hour = parseFloat(q.get('hour') ?? '12');
state.raining = q.get('rain') === '1';
const target = new THREE.Vector3(...(q.get('look') || '224,0,-120').split(',').map(Number));
const player = { position: target.clone() };
const world = { scene, camera, renderer, net, city, player, state, events, time: 0 };
camera.position.set(...(q.get('cam') || '260,60,-60').split(',').map(Number));
const controls = new OrbitControls(camera, canvas);
controls.target.copy(target); controls.update();
if (q.get('nocontrols') === '1') controls.enabled = false;

const hour = document.getElementById('hour'), hv = document.getElementById('hv'), rain = document.getElementById('rain'), auto = document.getElementById('auto');
hour.value = state.hour; rain.checked = state.raining;
hour.oninput = () => { state.hour = parseFloat(hour.value); };
rain.onchange = () => { state.raining = rain.checked; };
const timer = new THREE.Timer();
let frames = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  timer.update(ts);
  const dt = Math.min(timer.getDelta(), 0.05);
  world.time += dt;
  if (auto.checked) { state.hour = (state.hour + dt / 60) % 24; hour.value = state.hour; }
  if (q.get('follow') !== '0') { player.position.copy(controls.target); }
  controls.update();
  try { city.update(dt, world); sky.update(dt, world); } catch (e) { console.error(e); }
  renderer.render(scene, camera);
  hv.textContent = state.hour.toFixed(2);
  acc += dt; frames++;
  if (acc > 1) { document.getElementById('stats').textContent = ` ${Math.round(frames / acc)}fps calls ${renderer.info.render.calls} tris ${(renderer.info.render.triangles / 1000).toFixed(0)}k`; acc = 0; frames = 0; }
}
requestAnimationFrame(frame);
window.H = { THREE, scene, camera, controls, state, world, city, sky, renderer,
  view(cam, look, hr, rn) { camera.position.set(...cam); controls.target.set(...look); controls.update(); if (hr !== undefined) { state.hour = hr; hour.value = hr; } if (rn !== undefined) state.raining = !!rn; } };
</script>
</body>
</html>
